[info]
name = "IJA Theme"
version = "2.0.1"
author = "Iraqi Jewish Archive Team"
;description = ""
;theme_link = ""
author_link = "https://ijarchive.org/"
omeka_version_constraint = "^4.0.0"

[config]
elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"

elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "HTML content to appear in the footer"
elements.footer.attributes.value = "Powered by Omeka"

elements.truncate_body_property.name = "truncate_body_property"
elements.truncate_body_property.attributes.id = "truncate_body_property"
elements.truncate_body_property.type = "Laminas\Form\Element\Select"
elements.truncate_body_property.options.label = "Truncate Body Property"
elements.truncate_body_property.info = "How to handle long values for the body property of each resource on the browse page."
elements.truncate_body_property.options.value_options.full = "Show full value"
elements.truncate_body_property.options.value_options.fadeout = "Show 4 lines and fade out"
elements.truncate_body_property.options.value_options.ellipsis = "Show 4 lines and clip with an ellipsis"

; The curated homepage leaves saved page blocks intact; disable to render them.
elements.home_layout.name = "home_layout"
elements.home_layout.type = "Laminas\Form\Element\Checkbox"
elements.home_layout.options.label = "Use the archive homepage design"
elements.home_layout.options.info = "On the home page, show the split introduction and collection highlights instead of the saved page blocks. Disable to restore those blocks."
elements.home_layout.attributes.value = 1

elements.home_heading.name = "home_heading"
elements.home_heading.type = "Laminas\Form\Element\Text"
elements.home_heading.options.label = "Homepage heading"
elements.home_heading.attributes.value = "Explore the Iraqi Jewish Archive"

elements.home_intro.name = "home_intro"
elements.home_intro.type = "Laminas\Form\Element\Textarea"
elements.home_intro.options.label = "Homepage introduction"
elements.home_intro.attributes.value = "Discover books, documents and photographs that illuminate Jewish life in Iraq."

elements.home_featured_items.name = "home_featured_items"
elements.home_featured_items.type = "Laminas\Form\Element\Text"
elements.home_featured_items.options.label = "Homepage featured item IDs"
elements.home_featured_items.options.info = "Up to four comma-separated item IDs, in display order. Only accessible items assigned to this site appear. Leave empty to hide highlights."
elements.home_featured_items.attributes.value = "17159,1022,284,269"

elements.home_image.name = "home_image"
elements.home_image.type = "Omeka\Form\Element\Asset"
elements.home_image.options.label = "Homepage image (optional)"
elements.home_image.options.info = "Leave empty to feature page 5 of Personal Letters (IJA 3339), linked to its item record."

elements.home_image_caption.name = "home_image_caption"
elements.home_image_caption.type = "Laminas\Form\Element\Text"
elements.home_image_caption.options.label = "Uploaded homepage image caption and alternative text"
elements.home_image_caption.options.info = "Used for an uploaded image. The built-in archive image always has its verified record and page attribution."
elements.home_image_caption.attributes.value = "Featured collection image"

elements.home_image_item_id.name = "home_image_item_id"
elements.home_image_item_id.type = "Laminas\Form\Element\Text"
elements.home_image_item_id.options.label = "Uploaded homepage image item ID (optional)"
elements.home_image_item_id.options.info = "For an uploaded image, optionally link to its item record on this site. The built-in image links to item 16426 automatically."
